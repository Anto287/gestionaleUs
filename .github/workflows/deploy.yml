name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verifica il titolo della PR
        if: github.event_name == 'pull_request'
        env:
          TITOLO_PR: ${{ github.event.pull_request.title }}
        run: node scripts/versione-app.mjs --titolo "$TITOLO_PR"
      - name: Calcola la versione dell’app
        if: github.event_name != 'pull_request'
        run: |
          versione="$(node scripts/versione-app.mjs)"
          printf 'VITE_APP_VERSION=%s\n' "$versione" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - name: Prepara Chromium e verifica le dipendenze
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); await browser.close();"; then
            npx playwright install-deps chromium
          fi
      - run: npm run test:browser
      - run: npm run test:layout
      - name: Schermate per revisione grafica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisione-grafica
          path: |
            /tmp/us-layout-final/*.png
            /tmp/us-layout-final/audit.json
            /tmp/us-classifica-preview/*.png
            /tmp/us-resilience/*.png
            /tmp/us-compatta/*.png
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
